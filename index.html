<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Forja das Almas — Pixel Weapon Shop</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="ui-container">
        <div id="ui-header">
            <div class="rune-line">— ✦ —</div>
            <h2>FORJA DAS ALMAS</h2>
            <div class="rune-sub">Arsenal do Condenado</div>
        </div>

        <form id="formArma">
            <input type="hidden" id="armaId">
            <label for="nomeArma">Nome da Arma</label>
            <input type="text" id="nomeArma" placeholder="ex: Lâmina da Ruína" required>
            <label for="tipoArma">Tipo</label>
            <select id="tipoArma">
                <option value="espada">Espada Bastarda</option>
                <option value="martelo">Martelo de Guerra</option>
                <option value="foice">Foice das Almas</option>
                <option value="lanca">Lança do Pântano</option>
            </select>
            <label for="danoArma">Dano</label>
            <input type="number" id="danoArma" placeholder="ex: 50" min="1" max="999" required>
            <button type="submit" id="btnSalvar">
                <span id="btnLabel">Forjar Arma</span>
                <span id="btnVerb" class="btn-verb">POST</span>
            </button>
            <button type="button" id="btnCancelar" class="btn-cancelar" style="display:none">Cancelar</button>
        </form>

        <div id="lista-container">
            <div id="lista-header">Arsenal <span id="contador-armas">0</span></div>
            <div id="lista-armas"></div>
        </div>
    </div>

    <div id="dica-interacao">Clique em uma arma na cena para editar ou deletar</div>

    <a-scene fog="type: linear; color: #0a0806; near: 8; far: 25">

        <a-plane position="0 0 -8" rotation="-90 0 0" width="40" height="40"
            material="color: #1a1510; roughness: 1"></a-plane>
        <a-plane position="0 0.01 -8" rotation="-90 0 0" width="40" height="40"
            material="color: #2a1f14; wireframe: true"></a-plane>

        <a-box position="0 0.08 -4.2" width="22" height="0.22" depth="2.2"
            material="color: #2d2318; roughness: 1"></a-box>
        <a-box position="-7.5 0.22 -4.2" width="0.08" height="0.15" depth="2.25" material="color: #4a3520"></a-box>
        <a-box position="0   0.22 -4.2" width="0.08" height="0.15" depth="2.25" material="color: #4a3520"></a-box>
        <a-box position="7.5 0.22 -4.2" width="0.08" height="0.15" depth="2.25" material="color: #4a3520"></a-box>

        <a-plane position="0 5 -10" width="40" height="16" material="color: #110d08"></a-plane>
        <a-plane position="0 5 -9.9" width="40" height="16"
            material="color: #1a1410; wireframe: true; wireframeLinewidth: 1; opacity: 0.35; transparent: true"></a-plane>

        <a-box position="-6 4 -9.8" width="2.4" height="8" depth="0.3" material="color: #1c1509"></a-box>
        <a-box position=" 0 4 -9.8" width="2.4" height="8" depth="0.3" material="color: #1c1509"></a-box>
        <a-box position=" 6 4 -9.8" width="2.4" height="8" depth="0.3" material="color: #1c1509"></a-box>

        <!-- Tochas -->
        <a-entity position="-4.5 3.2 -9.5">
            <a-cylinder height="0.5" radius="0.06" material="color: #3a2508"></a-cylinder>
            <a-sphere position="0 0.32 0" radius="0.13" material="color: #c8560a; emissive: #8b3a00; emissiveIntensity: 0.9"></a-sphere>
        </a-entity>
        <a-entity position="4.5 3.2 -9.5">
            <a-cylinder height="0.5" radius="0.06" material="color: #3a2508"></a-cylinder>
            <a-sphere position="0 0.32 0" radius="0.13" material="color: #c8560a; emissive: #8b3a00; emissiveIntensity: 0.9"></a-sphere>
        </a-entity>

        <!-- Velas -->
        <a-entity position="-9.5 0.3 -4.5">
            <a-cylinder height="0.4" radius="0.05" material="color: #c8c0a0"></a-cylinder>
            <a-sphere position="0 0.23 0" radius="0.07" material="color: #e8a040; emissive: #7a4000; emissiveIntensity: 0.7"></a-sphere>
        </a-entity>
        <a-entity position="9.5 0.3 -4.5">
            <a-cylinder height="0.4" radius="0.05" material="color: #c8c0a0"></a-cylinder>
            <a-sphere position="0 0.23 0" radius="0.07" material="color: #e8a040; emissive: #7a4000; emissiveIntensity: 0.7"></a-sphere>
        </a-entity>

        <a-text value="Forja das Almas" position="0 8.2 -9.5" align="center" color="#5c4020" width="14"></a-text>

        <a-light type="ambient" color="#1e1208" intensity="1.3"></a-light>
        <a-light type="point" position="-4.5 3.5 -9" color="#c8560a" intensity="2.0" distance="14"></a-light>
        <a-light type="point" position="4.5 3.5 -9"  color="#c8560a" intensity="2.0" distance="14"></a-light>
        <a-light type="point" position="0 4 -4" color="#8a5020" intensity="0.9" distance="10"></a-light>

        <a-sky color="#040201"></a-sky>

        <a-entity id="vitrine-armas" position="0 0.8 -4.2"></a-entity>

        <a-camera position="0 1.6 1.5" look-controls="magicWindowTrackingEnabled: false">
            <a-cursor color="#c8860a" fuse="false" raycaster="objects: .interativel" material="opacity: 0.7"></a-cursor>
        </a-camera>

    </a-scene>

    <script src="js/db.js"></script>
    <script src="js/scene.js"></script>
</body>
</html>
