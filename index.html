<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Forja de Armas VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Interface 2D do CRUD -->
    <div id="ui-container">
        <h2>Forja (CRUD)</h2>
        <form id="formArma">
            <input type="hidden" id="armaId">
            <input type="text" id="nomeArma" placeholder="Nome da Arma" required>
            <select id="tipoArma">
                <option value="espada">Espada (Caixa)</option>
                <option value="machado">Machado (Cilindro)</option>
                <option value="magia">Cajado (Esfera)</option>
            </select>
            <input type="number" id="danoArma" placeholder="Dano (ex: 50)" required>
            <button type="submit" id="btnSalvar">Criar Arma (POST)</button>
        </form>
    </div>

    <!-- Cena 3D A-Frame -->
    <a-scene>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#333333"></a-plane>
        <a-sky color="#242424"></a-sky>

        <a-entity id="vitrine-armas" position="0 1 -4"></a-entity>

        <a-camera>
            <a-cursor color="#ff4757"></a-cursor>
        </a-camera>
    </a-scene>

    <script src="js/db.js"></script>
    <script src="js/scene.js"></script>
</body>
</html>
